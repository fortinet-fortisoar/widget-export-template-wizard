<form data-ng-submit="save()" class="noMargin" name="exportTemplateWizardForm"
    data-ng-class="{'state-wait': processing }" novalidate>
    <div class="modal-header">
        <h3 class="modal-title col-md-9">{{'exportTemplateWizard.EDIT_VIEW_TITLE' | translate}}</h3>
        <button type="button" class="close" data-ng-click="cancel()" data-dismiss="modal" aria-label="Close"
            id="close-edit-widget-form-btn">
            <div aria-hidden="true" class="version-button">+</div>
        </button>
    </div>
    <div class="modal-body">
        <div class="form-group importWiz">
            <div class="padding-20 margin-top-md padding-top-md padding-bottom-md">
                <p class="font-Size-13 muted">
                    <span data-ng-bind-html="'exportTemplateWizard.EDIT_VIEW_SELECT_DESCRIPTION' | translate | domPurifySanitize"></span>
                </p>
            </div>
            <div class="mertics-widget-border"></div>
            <div class="margin-top-md margin-bottom-md">
                <h6>{{'exportTemplateWizard.EDIT_VIEW_FILTER_CRITERIA' | translate}}</h6>
            </div>
            <div class="form-group"
                data-ng-class="{ 'has-error': exportTemplateWizardForm.exportTemplateFilters.$invalid && exportTemplateWizardForm.exportTemplateFilters.$touched }">
                <div data-cs-conditional name="exportTemplateFilters" data-ng-if="fieldsArray.length > 0"
                    data-fields="fields" data-reset-field="fields" data-mode="'queryFilters'"
                    data-ng-model="config.query" data-parent-form="exportTemplateWizardForm"
                    data-enable-expression="(page==='dashboard' || page==='reporting')" data-show-uuid="true"
                    data-form-name="'exportTemplateWizardForm'"></div>
                <div data-cs-messages="exportTemplateWizardForm.exportTemplateFilters"></div>
            </div>
            <div class="mertics-widget-border"></div>
            <div class="margin-top-md margin-bottom-md">
                <h6>{{'exportTemplateWizard.EDIT_VIEW_DEFAULT_SORT' | translate}}</h6>
            </div>
            <div class="form-group"
                data-ng-class="{ 'has-error': exportTemplateWizardForm.exportTemplateSortBy.$invalid && exportTemplateWizardForm.exportTemplateSortBy.$touched }">
                <div data-cs-default-sort name="exportTemplateSortBy" data-ng-model="config.query"
                    data-fields-array="fieldsArray" data-parent-form="cardForm"></div>
                <div data-cs-messages="exportTemplateWizardForm.exportTemplateSortBy"></div>
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <button id="edit-widget-save" type="submit" class="btn btn-sm btn-primary"><i
                class="icon icon-check margin-right-sm"></i>{{'exportTemplateWizard.EDIT_VIEW_SAVE_BTN_LABEL' | translate}}</button>
        <button id="edit-widget-cancel" type="button" class="btn btn-sm btn-default" data-ng-click="cancel()"><i
                class="icon icon-close margin-right-sm"></i>{{'exportTemplateWizard.EDIT_VIEW_CLOSE_BTN_LABEL' | translate}}</button>
    </div>
</form>
